name: Signed macOS distribution

on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Upstream release tag (empty selects newest unsigned tag)'
        type: string
        required: false

concurrency:
  group: signed-macos-distribution
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resolve:
    if: github.repository == 'wjlfish/Bugaoshan-macos' && github.ref == 'refs/heads/macos-signing'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      ready: ${{ steps.select.outputs.ready }}
      tag: ${{ steps.select.outputs.tag }}
      sha: ${{ steps.select.outputs.sha }}
      version: ${{ steps.select.outputs.version }}
      build: ${{ steps.select.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: signing
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: The-Brotherhood-of-SCU/Bugaoshan
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Test independent tag selection and transient network retries
        run: python3 -m unittest discover -s signing/.github/scripts -p test_macos_distribution.py
      - name: Select an integrated upstream release tag
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: python3 signing/.github/scripts/macos_signing.py --source source --tag "$REQUESTED_TAG"

  compile:
    needs: resolve
    if: needs.resolve.outputs.ready == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      MACOS_BUILD_NAME: ${{ needs.resolve.outputs.version }}
      MACOS_BUILD_NUMBER: ${{ needs.resolve.outputs.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: signing
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: source
          repository: The-Brotherhood-of-SCU/Bugaoshan
          ref: ${{ needs.resolve.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: subosito/flutter-action@v2.18.0
        with:
          flutter-version: '3.44.9'
          channel: stable
          cache: true
      - name: Compile upstream app without credentials
        working-directory: source
        run: MACOS_SOURCE_DIR="$PWD" bash ../signing/tool/macos_distribution.sh unsigned
      - uses: actions/upload-artifact@v4
        with:
          name: macos-for-signing
          path: source/build/macos/validation/Bugaoshan-unsigned.zip
          if-no-files-found: error
          retention-days: 2

  sign:
    needs: [resolve, compile]
    runs-on: macos-15
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      SOURCE_TAG: ${{ needs.resolve.outputs.tag }}
      SOURCE_SHA: ${{ needs.resolve.outputs.sha }}
      BUILD_NAME: ${{ needs.resolve.outputs.version }}
      BUILD_NUMBER: ${{ needs.resolve.outputs.build }}
    steps:
      # Signing code comes from this repository's protected orchestration branch,
      # not from the source app or a pull request. Build jobs receive no secrets.
      - uses: actions/checkout@v4
        with:
          path: signing
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: macos-for-signing
          path: unsigned
      - name: Import signing identity into a temporary keychain
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APP_PROFILE: ${{ secrets.MACOS_APP_PROFILE_BASE64 }}
          WIDGET_PROFILE: ${{ secrets.MACOS_WIDGET_PROFILE_BASE64 }}
          NOTARY_KEY: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/signing"
          python3 - <<'PY'
          import base64, os, pathlib
          p = pathlib.Path(os.environ['RUNNER_TEMP']) / 'signing'
          for env, name in [('CERTIFICATE', 'identity.p12'), ('APP_PROFILE', 'app.provisionprofile'), ('WIDGET_PROFILE', 'widget.provisionprofile')]:
              if not os.environ[env]:
                  raise ValueError(f'Missing signing credential: {env}')
              (p / name).write_bytes(base64.b64decode(os.environ[env], validate=True))
          if not os.environ['NOTARY_KEY']:
              raise ValueError('Missing notarization key')
          (p / 'AuthKey.p8').write_text(os.environ['NOTARY_KEY'])
          PY
          keychain_password=$(openssl rand -hex 32)
          echo "::add-mask::$keychain_password"
          security create-keychain -p "$keychain_password" "$RUNNER_TEMP/signing/release.keychain-db"
          security set-keychain-settings -lut 7200 "$RUNNER_TEMP/signing/release.keychain-db"
          security unlock-keychain -p "$keychain_password" "$RUNNER_TEMP/signing/release.keychain-db"
          security import "$RUNNER_TEMP/signing/identity.p12" -P "$CERTIFICATE_PASSWORD" -k "$RUNNER_TEMP/signing/release.keychain-db" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$RUNNER_TEMP/signing/release.keychain-db" >/dev/null
          security list-keychains -d user -s "$RUNNER_TEMP/signing/release.keychain-db"
          ditto -x -k unsigned/Bugaoshan-unsigned.zip unsigned
      - name: Sign, notarize, staple and assess app and DMG
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          python3 signing/tool/macos_dmg.py sign --bundle unsigned/不高山上.app --source signing \
            --tag "$SOURCE_TAG" --sha "$SOURCE_SHA" --version "$BUILD_NAME" --build "$BUILD_NUMBER" \
            --keychain "$RUNNER_TEMP/signing/release.keychain-db" \
            --app-profile "$RUNNER_TEMP/signing/app.provisionprofile" \
            --widget-profile "$RUNNER_TEMP/signing/widget.provisionprofile" \
            --notary-key "$RUNNER_TEMP/signing/AuthKey.p8" --output signed
      - name: Publish macOS release only in this personal repository
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="macos-$SOURCE_TAG"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null | grep -qx true; then
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
          fi
          opts=()
          if [[ "$SOURCE_TAG" == *-* ]]; then opts+=(--prerelease); fi
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --draft "${opts[@]}" \
            --title "macOS $SOURCE_TAG" \
            --notes "Signed and Apple-notarized universal DMG. Source: https://github.com/The-Brotherhood-of-SCU/Bugaoshan/commit/$SOURCE_SHA . This personal distribution runs independently of upstream releases."
          gh release upload "$tag" --repo "$GITHUB_REPOSITORY" signed/*.dmg signed/macos-manifest.json
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false "${opts[@]}"
      - name: Remove temporary private keys
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing/release.keychain-db" || true
          rm -rf "$RUNNER_TEMP/signing"
